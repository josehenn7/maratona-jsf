<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:body>
    <h:head>
        <h:form>
            <p:messages autoUpdate="true"/>
            <h2>Validando dados do usuário</h2>
            <h:panelGrid columns="2">
                <h:outputLabel value="#{testeFlowBuilderNestedBean.username}"/>
                <h:outputLabel value="#{testeFlowBuilderNestedBean.usersurname}"/>
                <h:commandButton value="Validar Usuario" action="#{testeFlowBuilderNestedBean.validarUser()}"/>
                <h:commandButton value="voltar para o inicio" action="exitToNewInicio"/>
            </h:panelGrid>
        </h:form>
    </h:head>
</h:body>
</html>
